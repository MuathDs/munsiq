[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# No sqlalchemy.url here on purpose. The DSN carries a password and is read from
# backend/.env by alembic/env.py via pydantic-settings, so no credential ever
# lands in a tracked file.

# No post_write_hooks: alembic resolves console_scripts entrypoints, and the
# ruff shim is not reachable that way under this machine's Application Control
# policy. Run `python -m ruff format alembic/versions/` by hand instead.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
