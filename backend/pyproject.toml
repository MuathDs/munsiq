[project]
name = "munsiq-backend"
version = "0.1.0"
description = "Munsiq — Arabic/English invoice extraction for Saudi B2B (ZATCA)."
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2",
    "pydantic-settings>=2",
    "pypdf>=5",          # ZATCA Step Zero: walk /EmbeddedFiles for the UBL attachment
    # UBL 2.1 parsing with explicit namespace maps.
    # Pinned <6 deliberately. On this Windows machine a WDAC code-integrity
    # policy (ID {0283ac0f-fff1-49ae-ada1-8a933130cad6}) refuses to load lxml
    # 6.x's unsigned etree.pyd — "DLL load failed ... Application Control policy
    # has blocked this file", CodeIntegrity event 3033/3077. 5.3.0 loads fine,
    # so the block tracks binary reputation, not lxml itself. Revisit if the
    # policy changes; do not widen this pin without re-testing the import.
    "lxml>=5,<6",
    "python-multipart>=0.0.9",  # multipart/form-data for uploads
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",            # async Postgres driver
    "alembic>=1.13",
    "greenlet",                 # required by SQLAlchemy's async bridge
    "httpx>=0.27",              # Ollama native-API inference calls
    "pymupdf>=1.24",            # PDF text layer (words + boxes) and rasterization
    "pillow>=10",               # WebP encoding, OCR image handling
    "rapidfuzz>=3",             # grounding: match extracted values to OCR words
    # OCR fallback for pages with no text layer. NOTE: the bundled recogniser is
    # Chinese/English and contains ZERO Arabic characters — image-only Arabic
    # pages cannot be read and are reported as a validation finding rather than
    # returned as empty text. See docs/ingestion.md.
    "rapidocr-onnxruntime>=1.3",
    # ZATCA QR reading (app/services/qr.py): OpenCV's QR detector and the array
    # it reads. Both were already installed as rapidocr's own dependencies and
    # load under the WDAC policy; declared because we now import them directly.
    "opencv-python>=4.8",
    "numpy>=1.26",
    # XLSX rendering of the MunsiqInvoiceV1 export (two sheets, Arabic cells).
    # Pure Python, so it loads under the WDAC policy that blocks lxml 6.
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    # Pinned <2 for the same reason as lxml: the WDAC code-integrity policy on
    # this machine refuses to load mypy 2.x's unsigned compiled extension
    # ("DLL load failed while importing mypy", CodeIntegrity event 3077).
    # 1.18.2 loads. Re-test the import before widening this pin.
    "mypy>=1.11,<2",
    "lxml-stubs>=0.5",  # lxml ships no inline types; mypy --strict needs these
    "types-openpyxl",   # same, for openpyxl
    "pytest-cov>=5",    # branch coverage of the validation rules
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# --------------------------------------------------------------------------- #
# Tooling
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# RUF001 flags Arabic-Indic digits as "ambiguous" characters. In this codebase
# they are the subject under test and the data we exist to process, not a typo.
"tests/*" = ["RUF001"]
"app/services/normalize.py" = ["RUF001", "RUF002", "RUF003"]
"app/services/pipeline.py" = ["RUF001"]
"app/services/validation/*.py" = ["RUF001", "RUF002", "RUF003"]
"app/services/validation/rules/*.py" = ["RUF001", "RUF002", "RUF003"]
"scripts/*" = ["RUF001"]
# The UBL template is one XML document written out as it will be read; wrapping
# its lines would only make it harder to compare against the spec.
"scripts/make_test_invoices.py" = ["RUF001", "E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are called in argument defaults by design; that
# is the framework's idiom, not the B008 mutable-default bug.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# These ship no type information. pypdf and pymupdf are partially typed;
# rapidocr_onnxruntime has no py.typed marker at all.
module = ["pypdf.*", "rapidocr_onnxruntime.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# One event loop for the whole session. The async engine's connection pool binds
# to the loop that created it, so per-test loops would hand each test a pool of
# connections belonging to an already-closed loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = ["error::DeprecationWarning:app.*"]
